<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foldable Reader</title>
    <!-- Matcha.css CDN -->
    <link rel="stylesheet" href="https://matcha.mizu.sh/matcha.css">
    <style>
        .toolbar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-block-end: 1.5rem;
        }

        /* Matcha.css estiliza input[type=file], así que [hidden] no basta. */
        .file-input {
            display: none;
        }

        .empty {
            color: var(--muted-fg, #666);
            font-style: italic;
        }

        .notice {
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            background: color-mix(in srgb, currentColor 8%, transparent);
        }

        .notice-error {
            border-inline-start: 4px solid #c0392b;
        }
    </style>
</head>
<body>
    <div id="app">
        <main class="reader">
            <div class="toolbar">
                <button type="button" :disabled="loading" @click="pickFile">
                    {{ loading ? 'Cargando…' : 'Abrir JSON' }}
                </button>
                <input
                    ref="fileInput"
                    class="file-input"
                    type="file"
                    accept=".json,application/json"
                >
            </div>

            <p v-if="error" class="notice notice-error" role="alert">{{ error }}</p>

            <p v-if="!doc && !error" class="empty">Aún no hay texto. Abre un archivo JSON.</p>
        </main>
    </div>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const doc = ref(null);
                const error = ref('');
                const loading = ref(false);
                const fileInput = ref(null);

                function pickFile() {
                    fileInput.value?.click();
                }

                return { doc, error, loading, fileInput, pickFile };
            },
        }).mount('#app');
    </script>
</body>
</html>
